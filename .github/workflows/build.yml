name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the current package.json version"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # never let two releases race for the same tag
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The app now lives in desktop/ (monorepo: desktop/ + CLI/). Every run step
# resolves there, and the build paths below stay relative to it.
defaults:
  run:
    working-directory: desktop

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate. Catches syntax errors and broken references before spending
  # time on three platform builds.
  # ---------------------------------------------------------------------------
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server modules parse
        run: |
          for f in server.js lib/*.js; do node --check "$f" || exit 1; done
          for f in electron/*.cjs; do node --check "$f" || exit 1; done

      - name: UI markup and element ids
        run: node tools/verify-ui.mjs

      - name: Design contract (palette, motion, focus, a11y)
        run: node tools/verify-design.mjs

      - name: Render layer (highlighting, escaping, layout)
        run: node tools/verify-render.mjs

      - name: .gitignore does not exclude source files
        run: node tools/verify-gitignore.mjs

      - name: README links and image paths
        run: node tools/verify-readme.mjs

      - name: Core unit checks (credentials, catalog, decisions)
        run: node tools/verify-core.mjs

      - name: Server boots and serves the UI
        run: node tools/verify-server.mjs

      - name: Sessions API
        run: node tools/verify-sessions.mjs

      - name: CLI behaviour
        run: node tools/verify-cli.mjs

  # ---------------------------------------------------------------------------
  # Build every platform. Nothing is published from here.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            artifact: windows
          - os: macos-latest
            script: dist:mac
            artifact: macos
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No GH_TOKEN here on purpose: it makes electron-builder try to publish
      # releases itself. The dist scripts pass --publish never and the release
      # job below owns publishing.
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star-code-${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Auto-ship: if package.json's version has no matching tag yet, create it.
  # Runs only after every platform built, so a broken build can never ship.
  # ---------------------------------------------------------------------------
  tag:
    name: Tag version
    needs: [check, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.mk.outputs.created }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        name: Read version from package.json
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "package.json version: $V"

      - id: mk
        name: Create the tag if it is new
        run: |
          git fetch --tags --force
          V="v${{ steps.ver.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "tag $V already exists - nothing new to ship"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$V" -m "Star Code ${{ steps.ver.outputs.version }}"
            git push origin "$V"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "tagged $V"
          fi

  # ---------------------------------------------------------------------------
  # Publish. Triggered either by a pushed tag or by the tag job above.
  # Note: a tag pushed with GITHUB_TOKEN does not fire other workflows, which
  # is why this runs in the same run rather than relying on the tag event.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build, tag]
    if: |
      always()
      && needs.build.result == 'success'
      && (
           startsWith(github.ref, 'refs/tags/v')
           || needs.tag.outputs.created == 'true'
           || (github.event_name == 'workflow_dispatch' && inputs.publish)
         )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: desktop/artifacts

      - name: Collect files
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          echo "collected:"; ls -la out

      - id: t
        name: Resolve the tag name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # this job has no checkout, so take the version from the tag job
            TAG="v${{ needs.tag.outputs.version }}"
          fi
          if [[ "$TAG" == "v" ]]; then
            echo "::error::could not determine a version to publish"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing $TAG"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          name: Star Code ${{ steps.t.outputs.tag }}
          files: desktop/out/*
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          body: |
            Automated build from `${{ github.sha }}`.

            **Downloads**
            <!-- keep in sync with the artifactName templates in package.json -->
            | Platform | File |
            |---|---|
            | Windows | `Star-Code-Desktop-Setup-*.exe` (installer) or `Star-Code-Desktop-*-portable.exe` |
            | macOS | `Star-Code-Desktop-*-arm64.dmg` |
            | Linux | `Star-Code-Desktop-*-x86_64.AppImage` or `Star-Code-Desktop-*-amd64.deb` |

            The CLI ships with the source: `cd CLI && npm i -g .` then `star-code "…"`.

            Builds are unsigned, so your OS will warn on first launch.
