name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast gate: catch syntax errors and broken references before spending
  # time on three platform builds.
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse every server module
        run: |
          for f in server.js lib/*.js; do
            node --check "$f" || exit 1
          done
          for f in electron/*.cjs; do
            node --check "$f" || exit 1
          done

      - name: Verify the UI script parses
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const html = fs.readFileSync("public/index.html", "utf8");
          const i = html.lastIndexOf("<script>") + 8;
          const j = html.lastIndexOf("</script>");
          fs.writeFileSync("/tmp/ui.mjs", html.slice(i, j));
          EOF
          node --check /tmp/ui.mjs

      - name: Verify .gitignore does not exclude source files
        run: node tools/verify-gitignore.mjs

      - name: Verify README links and image paths
        run: node tools/verify-readme.mjs

      - name: Verify the embedded server starts and serves the UI
        run: |
          node - <<'EOF'
          const { startServer } = await import("./server.js");
          const s = await startServer({ port: 0, silent: true });
          const prov = await (await fetch(s.url + "/api/providers")).json();
          if (prov.providers.length !== 5) throw new Error("expected 5 providers");
          const ui = await (await fetch(s.url + "/")).text();
          if (ui.length < 50000) throw new Error("UI did not serve");
          const ico = await fetch(s.url + "/favicon.ico");
          if (!ico.ok) throw new Error("favicon missing");
          await s.close();
          console.log("server OK:", prov.providers.map(p => p.id).join(", "));
          EOF

  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            artifact: windows
          - os: macos-latest
            script: dist:mac
            artifact: macos
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned builds; set CSC_LINK / CSC_KEY_PASSWORD to sign
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star-code-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
