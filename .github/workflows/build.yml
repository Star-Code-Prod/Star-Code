name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast gate: catch syntax errors and broken references before spending
  # time on three platform builds.
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse every server module
        run: |
          for f in server.js lib/*.js; do
            node --check "$f" || exit 1
          done
          for f in electron/*.cjs; do
            node --check "$f" || exit 1
          done

      - name: Verify the UI script parses and its element ids resolve
        run: node tools/verify-ui.mjs

      - name: Verify .gitignore does not exclude source files
        run: node tools/verify-gitignore.mjs

      - name: Verify README links and image paths
        run: node tools/verify-readme.mjs

      - name: Verify the embedded server boots and serves the UI
        run: node tools/verify-server.mjs

  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            artifact: windows
          - os: macos-latest
            script: dist:mac
            artifact: macos
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No GH_TOKEN here on purpose: setting it makes electron-builder try to
      # publish releases itself and collide with the `release` job below.
      # Artifacts are uploaded by actions/upload-artifact instead.
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # unsigned builds; set CSC_LINK / CSC_KEY_PASSWORD to sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star-code-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
