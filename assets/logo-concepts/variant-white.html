<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Prompt Star — white / grey</title>
<style>
  :root{ --bg:#101010; --card:#1a1a1a; --line:#2b2b2b; --text:#e9e9e7; --muted:#9a9a95; --dim:#6f6f6a; }
  *{box-sizing:border-box}
  body{
    margin:0; padding:32px 36px 36px; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 22px}
  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;max-width:1180px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .row{display:flex;align-items:center;gap:14px}
  .chip{border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
  .chip.dark{background:#151515;border:1px solid #2a2a2a;width:168px;height:168px}
  .chip.light{background:#F7F5EF;border:1px solid #e2ded2;width:168px;height:168px}
  .chip img{width:118px;height:118px;display:block}
  .favs{display:flex;flex-direction:column;gap:10px;align-items:center}
  .fav{border-radius:8px;display:flex;align-items:center;justify-content:center;width:50px;height:50px}
  .fav.dark{background:#151515;border:1px solid #2a2a2a}
  .fav.light{background:#F7F5EF;border:1px solid #e2ded2}
  .fav img{width:32px;height:32px;display:block}
  .favlab{font-size:10px;color:var(--dim);font-family:ui-monospace,Consolas,monospace;margin-top:2px}
  .lockup{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;background:#141414;border:1px solid var(--line);border-radius:11px}
  .lockup img{width:50px;height:50px;display:block}
  .lw .t{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .lw .s{font-size:10.5px;color:#8c8c88;font-family:ui-monospace,Consolas,monospace;letter-spacing:.42em;margin-top:3px}
  .vs{display:flex;flex-direction:column;gap:14px}
  .vrow{display:flex;align-items:center;gap:16px}
  .vrow .lab{font-size:11px;color:var(--dim);font-family:ui-monospace,Consolas,monospace;width:74px;flex:none}
  .vrow img{width:56px;height:56px;display:block;border-radius:13px}
</style>
</head>
<body>
  <h1>Prompt Star — white / grey</h1>
  <p class="sub">Same mark, neutral palette · app-icon size, favicon size, lockup · shown next to the green original</p>
  <div class="grid">
    <div class="card">
      <div class="row">
        <div class="chip dark"><img src="02-prompt-star-white.svg" alt=""></div>
        <div class="chip light"><img src="02-prompt-star-white.svg" alt=""></div>
        <div class="favs">
          <div class="fav dark"><img src="02-prompt-star-white.svg" alt=""></div>
          <div class="fav light"><img src="02-prompt-star-white.svg" alt=""></div>
          <div class="favlab">32px favicon</div>
        </div>
      </div>
      <div class="lockup">
        <img src="02-prompt-star-white.svg" alt="">
        <div class="lw"><div class="t">Star Code</div><div class="s">DESKTOP</div></div>
      </div>
    </div>
    <div class="card">
      <div class="vs">
        <div class="vrow"><span class="lab">white</span><img src="02-prompt-star-white.svg" alt=""></div>
        <div class="vrow"><span class="lab">green</span><img src="02-prompt-star.svg" alt=""></div>
        <div class="vrow"><span class="lab">white 32px</span><img src="02-prompt-star-white.svg" alt="" style="width:32px;height:32px"></div>
      </div>
    </div>
  </div>
</body>
</html>
